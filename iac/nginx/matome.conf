# bare構成用(旧 nginx/default.conf の移植。app:8000 → 127.0.0.1:8000)
server {
    listen       80;
    listen  [::]:80;
    server_name  _;
    charset utf-8;

    # フロントバグ対応で封鎖中(Phase 2 で類似記事機能を復活させる際に外す)
    location /v1/article/similar/ {
        deny all;
    }

    location /v1/ {
        proxy_pass   http://127.0.0.1:8000;
    }

    # 死活監視用(外形監視から叩ける)
    location = /health {
        proxy_pass   http://127.0.0.1:8000;
    }

    # 画像・scraper-rules.json の配信と、アプリからのWebDAVアップロード受け
    location /static/ {
        root /var/www;
        dav_methods PUT DELETE MKCOL COPY MOVE;
        dav_access user:rw group:rw all:rw;
        create_full_put_path on;
        autoindex on;
        charset utf-8;
    }
}
